
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <style>
      .st-green { fill: #008a45; }
      .st-red { fill: #e31e24; }
      .st-yellow { fill: #f9b71e; }
      .st-text { font-family: 'Playfair Display', serif; font-weight: bold; }
    </style>
  </defs>
  <!-- Background Compass Star -->
  <g transform="translate(150, 150)">
    <path class="st-green" d="M0 -140 L15 -15 L140 0 L15 15 L0 140 L-15 15 L-140 0 L-15 -15 Z"/>
    <path class="st-green" d="M-90 -90 L0 -15 L90 -90 L15 0 L90 90 L0 15 L-90 90 L-15 0 Z" opacity="0.8"/>
  </g>
  
  <!-- Central Circle -->
  <circle cx="150" cy="150" r="85" fill="white" stroke="#008a45" stroke-width="2"/>
  
  <!-- The Bowl/Handi -->
  <g transform="translate(150, 175)">
    <path class="st-red" d="M-50 0 C-50 30 50 30 50 0 L-50 0 Z"/>
    <path class="st-red" d="M-55 -3 L55 -3 L50 3 L-50 3 Z"/>
    <path class="st-yellow" d="M-25 -20 C-35 -35 -15 -35 -5 -15 L-10 -5 Z"/>
  </g>
  
  <!-- "Sai's" Text -->
  <text x="150" y="145" text-anchor="middle" class="st-yellow st-text" font-size="34">Sai's</text>
  
  <!-- Bottom Branding -->
  <text x="150" y="275" text-anchor="middle" class="st-red st-text" font-size="22" letter-spacing="1">SAI INDIAN CUISINE</text>
</svg>
